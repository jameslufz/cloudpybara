name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/cloudpybara"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/cloudpybara
            docker compose pull
            docker compose up -d

  notification:
    needs: deployment
    runs-on: ubuntu-latest
    steps:
      - name: Alert telegram message to user
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -s "https://api.telegram.org/${{ secrets.TELEGRAM_BOT_ID }} /sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&parse_mode=MarkdownV2&text=พว่อะ พว่อะ ระบบคลาวน์ไอปิ deploy เสร็จแล้วพว่อ [https\:\/\/cloud\-micro\-sv\-1\.jameslufz\.me\/](https://cloud-micro-sv-1.jameslufz.me/)" 2> /dev/null
